<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Système de Recouvrement ACF</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar-custom { background-color: #1a252f; }
        .nav-link { color: #adb5bd !important; font-weight: 500; font-size: 0.9rem; margin-right: 5px; border-radius: 4px; }
        .nav-link:hover, .nav-link.active { color: #fff !important; background-color: #2c3e50; }
        .card-stat { border-left: 4px solid #0d6efd; border-radius: 6px; }
        .card-stat.encaissement { border-left-color: #198754; }
        .card-stat.reliquat { border-left-color: #dc3545; }
        .card-stat.impayes { border-left-color: #ffc107; }
    </style>
</head>
<body>
    <!-- Navigation / Onglets -->
    <nav class="navbar navbar-expand-lg navbar-custom px-3 mb-4">
        <a class="navbar-brand text-white fw-bold me-4" href="/">Système de Recouvrement ACF</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link {% if active_tab == 'dashboard' %}active{% endif %}" href="/"><i class="bi bi-speedometer2"></i> Tableau de Bord</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if active_tab == 'importation' %}active{% endif %}" href="/importation"><i class="bi bi-file-earmark-arrow-up"></i> Importation Données</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if active_tab == 'traitement' %}active{% endif %}" href="/traitement"><i class="bi bi-gear"></i> Traitement des Arriérés</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if active_tab == 'recherche' %}active{% endif %}" href="/recherche"><i class="bi bi-search"></i> Recherche Impayés</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if active_tab == 'extrait' %}active{% endif %}" href="/extrait"><i class="bi bi-file-earmark-text"></i> Extrait de Compte</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if active_tab == 'lsp' %}active{% endif %}" href="/lsp"><i class="bi bi-file-earmark-pdf"></i> Génération LSP & Extrait</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container-fluid px-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
